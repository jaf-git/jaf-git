<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Bank Marketing classifiers — imbalanced classification on 45,211 UCI records, classical models then a tuned neural network">
  <title>Bank Marketing — imbalanced classification</title>
  <defs>
    <linearGradient id="lSpine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#10B981"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="lGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lClip"><rect x="0" y="0" width="1200" height="240" rx="20"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    /* metric bars filling to their real values */
    .bar { transform-origin: left center; animation: fill 5s cubic-bezier(.16,1,.3,1) infinite; }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: .35s; }
    .b3 { animation-delay: .7s; }
    @keyframes fill {
      0%       { transform: scaleX(0); }
      30%, 78% { transform: scaleX(1); }
      95%,100% { transform: scaleX(0); }
    }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.55} 50%{opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .bar,.glow { animation: none; }
      .bar { transform: scaleX(1); }
    }
  </style>

  <g clip-path="url(#lClip)">
    <rect width="1200" height="240" fill="#0A0F1C"/>
    <ellipse class="glow" cx="960" cy="120" rx="320" ry="190" fill="url(#lGlow)"/>
    <rect x="0" y="0" width="6" height="240" fill="url(#lSpine)"/>

    <text class="mono" x="48" y="48" font-size="11" fill="#34D399" letter-spacing="2">MACHINE LEARNING · INTELLIGENT SYSTEMS</text>
    <text class="sans" x="48" y="92" font-size="34" font-weight="800" fill="#F1F5F9" letter-spacing="-0.8">Bank Marketing Classifiers</text>
    <text class="sans" x="48" y="126" font-size="16" fill="#94A3B8">Term-deposit prediction on 45,211 records — classical models first, then a tuned neural network.</text>

    <g transform="translate(48, 150)">
      <rect x="0"   y="0" width="66"  height="26" rx="13" fill="#12203A" stroke="#1E3A5F" stroke-width="1"/>
      <text class="mono" x="33"  y="17" font-size="10.5" fill="#93C5FD" text-anchor="middle">PYTHON</text>

      <rect x="74"  y="0" width="60"  height="26" rx="13" fill="#2A1015" stroke="#7F1D1D" stroke-width="1"/>
      <text class="mono" x="104" y="17" font-size="10.5" fill="#FCA5A5" text-anchor="middle">KERAS</text>

      <rect x="142" y="0" width="106" height="26" rx="13" fill="#2A1D0B" stroke="#78350F" stroke-width="1"/>
      <text class="mono" x="195" y="17" font-size="10.5" fill="#FCD34D" text-anchor="middle">TENSORFLOW</text>

      <rect x="256" y="0" width="112" height="26" rx="13" fill="#0B2530" stroke="#155E75" stroke-width="1"/>
      <text class="mono" x="312" y="17" font-size="10.5" fill="#67E8F9" text-anchor="middle">SCIKIT-LEARN</text>

      <rect x="376" y="0" width="68"  height="26" rx="13" fill="#12261A" stroke="#1E4620" stroke-width="1"/>
      <text class="mono" x="410" y="17" font-size="10.5" fill="#86EFAC" text-anchor="middle">PANDAS</text>
    </g>

    <text class="mono" x="48" y="210" font-size="10.5" fill="#64748B">ONLY 11.7% POSITIVES — SO ACCURACY IS REPORTED AND NEVER USED TO CHOOSE A MODEL</text>

    <!-- metric bars -->
    <g transform="translate(760, 78)">
      <text class="mono" x="0" y="-14" font-size="10" fill="#475569" letter-spacing="1.4">TUNED NETWORK, HELD-OUT TEST SET</text>

      <text class="mono" x="0"   y="14" font-size="10.5" fill="#94A3B8">ROC-AUC</text>
      <rect x="88" y="4" width="220" height="12" rx="6" fill="#111A2B"/>
      <rect class="bar b1" x="88" y="4" width="174" height="12" rx="6" fill="#34D399"/>
      <text class="mono" x="320" y="14" font-size="11" fill="#34D399">0.7910</text>

      <text class="mono" x="0"   y="44" font-size="10.5" fill="#94A3B8">F1</text>
      <rect x="88" y="34" width="220" height="12" rx="6" fill="#111A2B"/>
      <rect class="bar b2" x="88" y="34" width="96" height="12" rx="6" fill="#22D3EE"/>
      <text class="mono" x="320" y="44" font-size="11" fill="#22D3EE">0.4375</text>

      <text class="mono" x="0"   y="74" font-size="10.5" fill="#94A3B8">POSITIVES</text>
      <rect x="88" y="64" width="220" height="12" rx="6" fill="#111A2B"/>
      <rect class="bar b3" x="88" y="64" width="26" height="12" rx="6" fill="#FBBF24"/>
      <text class="mono" x="320" y="74" font-size="11" fill="#FBBF24">11.7 %</text>

      <text class="mono" x="0" y="104" font-size="9.5" fill="#475569">`duration` DROPPED — IT LEAKS THE ANSWER</text>
    </g>

    <rect x="1" y="1" width="1198" height="238" rx="19" fill="none" stroke="#1E293B" stroke-width="2"/>
  </g>
</svg>
