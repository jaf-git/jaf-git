<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Algorithms and data structures implemented in Java and C++ — trees, graphs, dynamic programming and concurrency, with complexities">
  <title>Algorithms &amp; data structures</title>
  <defs>
    <linearGradient id="aTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#60A5FA"/>
      <stop offset="50%"  stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="aGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="aGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <clipPath id="aClip"><rect x="0" y="0" width="1200" height="470" rx="20"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    .c1 { animation: card 10s ease-in-out infinite; animation-delay: 0s;   }
    .c2 { animation: card 10s ease-in-out infinite; animation-delay: 2.5s; }
    .c3 { animation: card 10s ease-in-out infinite; animation-delay: 5s;   }
    .c4 { animation: card 10s ease-in-out infinite; animation-delay: 7.5s; }
    @keyframes card {
      0%, 100% { stroke: #1E293B; }
      4%       { stroke: #64748B; }
      22%      { stroke: #1E293B; }
    }

    /* BFS wavefront over the little graph */
    .g0 { animation: visit 4s ease-in-out infinite; animation-delay: 0s;   }
    .g1 { animation: visit 4s ease-in-out infinite; animation-delay: .45s; }
    .g2 { animation: visit 4s ease-in-out infinite; animation-delay: .45s; }
    .g3 { animation: visit 4s ease-in-out infinite; animation-delay: .9s;  }
    .g4 { animation: visit 4s ease-in-out infinite; animation-delay: .9s;  }
    .g5 { animation: visit 4s ease-in-out infinite; animation-delay: 1.35s;}
    @keyframes visit {
      0%, 100% { fill: #1E293B; stroke: #334155; r: 11; }
      8%       { fill: #A78BFA; stroke: #DDD6FE; r: 14; }
      44%      { fill: #4C1D95; stroke: #7C3AED; r: 11; }
      88%      { fill: #1E293B; stroke: #334155; r: 11; }
    }
    .edge { stroke-dasharray: 4 5; animation: crawl 1.3s linear infinite; }
    @keyframes crawl { to { stroke-dashoffset: -9; } }
    .glow { animation: breathe 8s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.5} 50%{opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .c1,.c2,.c3,.c4,.g0,.g1,.g2,.g3,.g4,.g5,.edge,.glow { animation: none; }
    }
  </style>

  <g clip-path="url(#aClip)">
    <rect width="1200" height="470" fill="#070B14"/>
    <ellipse class="glow" cx="600" cy="60" rx="620" ry="220" fill="url(#aGlow)"/>
    <rect width="1200" height="470" fill="url(#aGrid)"/>

    <text class="mono" x="48" y="50" font-size="11" fill="#818CF8" letter-spacing="2.2">WRITTEN TWICE — ONCE IN JAVA, ONCE IN C++</text>
    <text class="sans" x="48" y="94" font-size="32" font-weight="800" fill="url(#aTitle)" letter-spacing="-0.8">Algorithms &amp; Data Structures</text>

    <!-- BFS motif, top right -->
    <g transform="translate(890, 44)">
      <text class="mono" x="118" y="0" font-size="9.5" fill="#475569" text-anchor="middle" letter-spacing="1.4">BFS WAVEFRONT</text>
      <line class="edge" x1="30"  y1="34" x2="106" y2="18"  stroke="#334155" stroke-width="1.5"/>
      <line class="edge" x1="30"  y1="34" x2="106" y2="52"  stroke="#334155" stroke-width="1.5"/>
      <line class="edge" x1="106" y1="18" x2="182" y2="16"  stroke="#334155" stroke-width="1.5"/>
      <line class="edge" x1="106" y1="52" x2="182" y2="50"  stroke="#334155" stroke-width="1.5"/>
      <line class="edge" x1="182" y1="16" x2="236" y2="34"  stroke="#334155" stroke-width="1.5"/>
      <line class="edge" x1="182" y1="50" x2="236" y2="34"  stroke="#334155" stroke-width="1.5"/>
      <circle class="g0" cx="30"  cy="34" r="11" fill="#1E293B" stroke="#334155" stroke-width="1.75"/>
      <circle class="g1" cx="106" cy="18" r="11" fill="#1E293B" stroke="#334155" stroke-width="1.75"/>
      <circle class="g2" cx="106" cy="52" r="11" fill="#1E293B" stroke="#334155" stroke-width="1.75"/>
      <circle class="g3" cx="182" cy="16" r="11" fill="#1E293B" stroke="#334155" stroke-width="1.75"/>
      <circle class="g4" cx="182" cy="50" r="11" fill="#1E293B" stroke="#334155" stroke-width="1.75"/>
      <circle class="g5" cx="236" cy="34" r="11" fill="#1E293B" stroke="#334155" stroke-width="1.75"/>
    </g>

    <!-- four columns -->
    <g transform="translate(48, 138)">

      <!-- TREES -->
      <g>
        <rect class="c1" x="0" y="0" width="264" height="296" rx="16" fill="#0C1322" stroke="#1E293B" stroke-width="1.75"/>
        <rect x="0" y="0" width="264" height="4" rx="2" fill="#3B82F6"/>
        <text class="sans" x="22" y="40" font-size="17" font-weight="700" fill="#93C5FD">Trees</text>
        <text class="mono" x="242" y="40" font-size="10" fill="#475569" text-anchor="end">10 PROBLEMS</text>

        <text class="mono" x="22" y="74"  font-size="11" fill="#CBD5E1">Morris traversal</text>
        <text class="mono" x="242" y="74" font-size="10" fill="#64748B" text-anchor="end">O(1) space</text>

        <text class="mono" x="22" y="102" font-size="11" fill="#CBD5E1">Iterative traversal</text>
        <text class="mono" x="242" y="102" font-size="10" fill="#64748B" text-anchor="end">explicit stack</text>

        <text class="mono" x="22" y="130" font-size="11" fill="#CBD5E1">B-tree construction</text>
        <text class="mono" x="242" y="130" font-size="10" fill="#64748B" text-anchor="end">node split</text>

        <text class="mono" x="22" y="158" font-size="11" fill="#CBD5E1">Lowest common ancestor</text>
        <text class="mono" x="242" y="158" font-size="10" fill="#64748B" text-anchor="end">O(n)</text>

        <text class="mono" x="22" y="186" font-size="11" fill="#CBD5E1">Max path sum</text>
        <text class="mono" x="242" y="186" font-size="10" fill="#64748B" text-anchor="end">O(n)</text>

        <text class="mono" x="22" y="214" font-size="11" fill="#CBD5E1">Diameter, height</text>
        <text class="mono" x="242" y="214" font-size="10" fill="#64748B" text-anchor="end">one pass</text>

        <text class="mono" x="22" y="242" font-size="11" fill="#CBD5E1">Rebuild from traversals</text>
        <text class="mono" x="242" y="242" font-size="10" fill="#64748B" text-anchor="end">2 variants</text>

        <text class="mono" x="22" y="270" font-size="11" fill="#CBD5E1">Children-sum property</text>
      </g>

      <!-- GRAPHS -->
      <g transform="translate(280, 0)">
        <rect class="c2" x="0" y="0" width="264" height="296" rx="16" fill="#0C1322" stroke="#1E293B" stroke-width="1.75"/>
        <rect x="0" y="0" width="264" height="4" rx="2" fill="#8B5CF6"/>
        <text class="sans" x="22" y="40" font-size="17" font-weight="700" fill="#C4B5FD">Graphs</text>
        <text class="mono" x="242" y="40" font-size="10" fill="#475569" text-anchor="end">10 PROBLEMS</text>

        <text class="mono" x="22" y="74"  font-size="11" fill="#CBD5E1">Dijkstra</text>
        <text class="mono" x="242" y="74" font-size="10" fill="#64748B" text-anchor="end">O(E log V)</text>

        <text class="mono" x="22" y="102" font-size="11" fill="#CBD5E1">Kruskal + union-find</text>
        <text class="mono" x="242" y="102" font-size="10" fill="#64748B" text-anchor="end">O(E log E)</text>

        <text class="mono" x="22" y="130" font-size="11" fill="#CBD5E1">Prim</text>
        <text class="mono" x="242" y="130" font-size="10" fill="#64748B" text-anchor="end">O(E log V)</text>

        <text class="mono" x="22" y="158" font-size="11" fill="#CBD5E1">BFS / DFS</text>
        <text class="mono" x="242" y="158" font-size="10" fill="#64748B" text-anchor="end">O(V+E)</text>

        <text class="mono" x="22" y="186" font-size="11" fill="#CBD5E1">Multi-source BFS</text>
        <text class="mono" x="242" y="186" font-size="10" fill="#64748B" text-anchor="end">O(V+E)</text>

        <text class="mono" x="22" y="214" font-size="11" fill="#CBD5E1">Cycle detection</text>
        <text class="mono" x="242" y="214" font-size="10" fill="#64748B" text-anchor="end">undirected</text>

        <text class="mono" x="22" y="242" font-size="11" fill="#CBD5E1">Bipartite check</text>
        <text class="mono" x="242" y="242" font-size="10" fill="#64748B" text-anchor="end">2-colouring</text>

        <text class="mono" x="22" y="270" font-size="11" fill="#CBD5E1">Connected components</text>
      </g>

      <!-- DP -->
      <g transform="translate(560, 0)">
        <rect class="c3" x="0" y="0" width="264" height="296" rx="16" fill="#0C1322" stroke="#1E293B" stroke-width="1.75"/>
        <rect x="0" y="0" width="264" height="4" rx="2" fill="#22D3EE"/>
        <text class="sans" x="22" y="40" font-size="17" font-weight="700" fill="#67E8F9">Recursion &amp; DP</text>

        <text class="mono" x="22" y="74"  font-size="11" fill="#CBD5E1">Memoisation → tabulation</text>
        <text class="mono" x="22" y="102" font-size="11" fill="#CBD5E1">Space-optimised tables</text>
        <text class="mono" x="242" y="102" font-size="10" fill="#64748B" text-anchor="end">O(1)</text>

        <text class="mono" x="22" y="130" font-size="11" fill="#CBD5E1">Frog jump</text>
        <text class="mono" x="22" y="158" font-size="11" fill="#CBD5E1">Subsequence generation</text>
        <text class="mono" x="242" y="158" font-size="10" fill="#64748B" text-anchor="end">take / skip</text>

        <text class="mono" x="22" y="186" font-size="11" fill="#CBD5E1">Target-sum subsets</text>
        <text class="mono" x="242" y="186" font-size="10" fill="#64748B" text-anchor="end">pruned</text>

        <text class="mono" x="22" y="214" font-size="11" fill="#CBD5E1">Sorting algorithms</text>
        <text class="mono" x="242" y="214" font-size="10" fill="#64748B" text-anchor="end">C++</text>

        <g transform="translate(22, 240)">
          <rect x="0" y="0" width="220" height="38" rx="9" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
          <text class="mono" x="12" y="16" font-size="9" fill="#475569">exponential → top-down →</text>
          <text class="mono" x="12" y="30" font-size="9" fill="#67E8F9">bottom-up → constant space</text>
        </g>
      </g>

      <!-- CONCURRENCY -->
      <g transform="translate(840, 0)">
        <rect class="c4" x="0" y="0" width="264" height="296" rx="16" fill="#0C1322" stroke="#1E293B" stroke-width="1.75"/>
        <rect x="0" y="0" width="264" height="4" rx="2" fill="#34D399"/>
        <text class="sans" x="22" y="40" font-size="17" font-weight="700" fill="#6EE7B7">Concurrency</text>

        <text class="mono" x="22" y="74"  font-size="11" fill="#CBD5E1">Dining philosophers</text>
        <text class="mono" x="242" y="74" font-size="10" fill="#64748B" text-anchor="end">deadlock</text>

        <text class="mono" x="22" y="102" font-size="11" fill="#CBD5E1">Wait groups</text>
        <text class="mono" x="242" y="102" font-size="10" fill="#64748B" text-anchor="end">join fan-out</text>

        <text class="mono" x="22" y="130" font-size="11" fill="#CBD5E1">Recursive FS traversal</text>
        <text class="mono" x="22" y="158" font-size="11" fill="#CBD5E1">Producer / consumer queues</text>
        <text class="mono" x="22" y="186" font-size="11" fill="#CBD5E1">POSIX pthreads, mutexes</text>
        <text class="mono" x="242" y="186" font-size="10" fill="#64748B" text-anchor="end">C</text>

        <text class="mono" x="22" y="214" font-size="11" fill="#CBD5E1">Parallel I/O fetching</text>

        <g transform="translate(22, 240)">
          <rect x="0" y="0" width="220" height="38" rx="9" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
          <text class="mono" x="12" y="16" font-size="9" fill="#475569">deadlock is a property of an</text>
          <text class="mono" x="12" y="30" font-size="9" fill="#6EE7B7">ordering, not of a bug</text>
        </g>
      </g>
    </g>

    <rect x="1" y="1" width="1198" height="468" rx="19" fill="none" stroke="#1E293B" stroke-width="2"/>
  </g>
</svg>
