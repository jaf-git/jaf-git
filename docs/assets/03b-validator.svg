e="15.5" fill="#35C463" font-weight="400" clip-path="url(#c87)" xml:space="preserve">endpoint, method or field where the two have diverged — in the editor, as you type.</text><defs><clipPath id="c88"><rect x="55" y="288.5" height="24.025000000000002" width="0"><animate attributeName="width" from="0" to="791.804" dur="0.76s" begin="12.23s" fill="freeze"/></rect></clipPath></defs><text x="58" y="304" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15.5" fill="#35C463" font-weight="400" clip-path="url(#c88)" xml:space="preserve">Moves contract failures from twenty minutes of CI delay to keystroke-level feedback.</text><defs><clipPath id="c89"><rect x="55" y="335.5" height="17.825" width="0"><animate attributeName="width" from="0" to="35.692" dur="0.16s" begin="12.69s" fill="freeze"/></rect></clipPath></defs><text x="58" y="347" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#14512A" font-weight="700" clip-path="url(#c89)" xml:space="preserve">TECH</text><defs><clipPath id="c90"><rect x="117" y="333.5" height="20.925" width="0"><animate attributeName="width" from="0" to="406.223" dur="0.45s" begin="12.79s" fill="freeze"/></rect></clipPath></defs><text x="120" y="347" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" fill="#35C463" font-weight="400" clip-path="url(#c90)" xml:space="preserve">Kotlin · IntelliJ Platform SDK · Gradle · OpenAPI</text><text x="1142" y="354" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#3BF07A" font-weight="700" text-anchor="end">[ open repository ]<animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/></text><rect x="1150" y="343" width="9" height="14" fill="#3BF07A"><animate attributeName="opacity" values="0;0;1;1;0" dur="2.2s" repeatCount="indefinite" keyTimes="0;.5;.55;.9;1"/></rect></svg>