<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Technical stack grouped by layer: languages, backend, data, testing, delivery and frontend">
  <title>Technical stack</title>
  <defs>
    <linearGradient id="sTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6EE7B7"/>
      <stop offset="50%"  stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="sGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sClip"><rect x="0" y="0" width="1200" height="470" rx="20"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .chip { font-size: 11.5px; }

    .r1 { animation: row 12s ease-in-out infinite; animation-delay: 0s; }
    .r2 { animation: row 12s ease-in-out infinite; animation-delay: 1.6s; }
    .r3 { animation: row 12s ease-in-out infinite; animation-delay: 3.2s; }
    .r4 { animation: row 12s ease-in-out infinite; animation-delay: 4.8s; }
    .r5 { animation: row 12s ease-in-out infinite; animation-delay: 6.4s; }
    .r6 { animation: row 12s ease-in-out infinite; animation-delay: 8.0s; }
    @keyframes row {
      0%, 100% { opacity: .55; }
      3%, 13%  { opacity: 1; }
      20%      { opacity: .55; }
    }
    .glow { animation: breathe 9s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.5} 50%{opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .r1,.r2,.r3,.r4,.r5,.r6,.glow { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#sClip)">
    <rect width="1200" height="470" fill="#070B14"/>
    <ellipse class="glow" cx="600" cy="40" rx="640" ry="200" fill="url(#sGlow)"/>

    <text class="mono" x="48" y="50" font-size="11" fill="#60A5FA" letter-spacing="2.2">WHAT I REACH FOR, AND WHY</text>
    <text class="sans" x="48" y="94" font-size="32" font-weight="800" fill="url(#sTitle)" letter-spacing="-0.8">Technical Stack</text>

    <!-- ROW 1 · LANGUAGES -->
    <g class="r1" transform="translate(48, 132)">
      <rect x="0" y="-4" width="4" height="40" rx="2" fill="#F59E0B"/>
      <text class="mono" x="20" y="14" font-size="11" fill="#FBBF24" letter-spacing="1.4">LANGUAGES</text>
      <g transform="translate(210, 0)">
        <rect x="0"   y="-2" width="74"  height="28" rx="14" fill="#2A1D0B" stroke="#78350F"/><text class="mono chip" x="37"  y="17" fill="#FCD34D" text-anchor="middle">Java 21</text>
        <rect x="84"  y="-2" width="58"  height="28" rx="14" fill="#2A1D0B" stroke="#78350F"/><text class="mono chip" x="113" y="17" fill="#FCD34D" text-anchor="middle">SQL</text>
        <rect x="152" y="-2" width="94"  height="28" rx="14" fill="#2A1D0B" stroke="#78350F"/><text class="mono chip" x="199" y="17" fill="#FCD34D" text-anchor="middle">TypeScript</text>
        <rect x="256" y="-2" width="44"  height="28" rx="14" fill="#2A1D0B" stroke="#78350F"/><text class="mono chip" x="278" y="17" fill="#FCD34D" text-anchor="middle">C</text>
        <rect x="310" y="-2" width="56"  height="28" rx="14" fill="#2A1D0B" stroke="#78350F"/><text class="mono chip" x="338" y="17" fill="#FCD34D" text-anchor="middle">C++</text>
        <rect x="376" y="-2" width="72"  height="28" rx="14" fill="#2A1D0B" stroke="#78350F"/><text class="mono chip" x="412" y="17" fill="#FCD34D" text-anchor="middle">Python</text>
        <rect x="458" y="-2" width="64"  height="28" rx="14" fill="#2A1D0B" stroke="#78350F"/><text class="mono chip" x="490" y="17" fill="#FCD34D" text-anchor="middle">Kotlin</text>
        <rect x="532" y="-2" width="58"  height="28" rx="14" fill="#2A1D0B" stroke="#78350F"/><text class="mono chip" x="561" y="17" fill="#FCD34D" text-anchor="middle">VHDL</text>
      </g>
    </g>

    <!-- ROW 2 · BACKEND -->
    <g class="r2" transform="translate(48, 186)">
      <rect x="0" y="-4" width="4" height="40" rx="2" fill="#6DB33F"/>
      <text class="mono" x="20" y="14" font-size="11" fill="#86EFAC" letter-spacing="1.4">BACKEND</text>
      <g transform="translate(210, 0)">
        <rect x="0"   y="-2" width="104" height="28" rx="14" fill="#12261A" stroke="#1E4620"/><text class="mono chip" x="52"  y="17" fill="#86EFAC" text-anchor="middle">Spring Boot</text>
        <rect x="114" y="-2" width="130" height="28" rx="14" fill="#12261A" stroke="#1E4620"/><text class="mono chip" x="179" y="17" fill="#86EFAC" text-anchor="middle">Spring Security</text>
        <rect x="254" y="-2" width="124" height="28" rx="14" fill="#12261A" stroke="#1E4620"/><text class="mono chip" x="316" y="17" fill="#86EFAC" text-anchor="middle">Spring Data JPA</text>
        <rect x="388" y="-2" width="124" height="28" rx="14" fill="#12261A" stroke="#1E4620"/><text class="mono chip" x="450" y="17" fill="#86EFAC" text-anchor="middle">Spring Session</text>
        <rect x="522" y="-2" width="86"  height="28" rx="14" fill="#12261A" stroke="#1E4620"/><text class="mono chip" x="565" y="17" fill="#86EFAC" text-anchor="middle">REST API</text>
        <rect x="618" y="-2" width="84"  height="28" rx="14" fill="#12261A" stroke="#1E4620"/><text class="mono chip" x="660" y="17" fill="#86EFAC" text-anchor="middle">OpenAPI</text>
        <rect x="712" y="-2" width="104" height="28" rx="14" fill="#12261A" stroke="#1E4620"/><text class="mono chip" x="764" y="17" fill="#86EFAC" text-anchor="middle">Hexagonal</text>
      </g>
    </g>

    <!-- ROW 3 · DATA -->
    <g class="r3" transform="translate(48, 240)">
      <rect x="0" y="-4" width="4" height="40" rx="2" fill="#3B82F6"/>
      <text class="mono" x="20" y="14" font-size="11" fill="#93C5FD" letter-spacing="1.4">DATA</text>
      <g transform="translate(210, 0)">
        <rect x="0"   y="-2" width="102" height="28" rx="14" fill="#12203A" stroke="#1E3A5F"/><text class="mono chip" x="51"  y="17" fill="#93C5FD" text-anchor="middle">PostgreSQL</text>
        <rect x="112" y="-2" width="72"  height="28" rx="14" fill="#12203A" stroke="#1E3A5F"/><text class="mono chip" x="148" y="17" fill="#93C5FD" text-anchor="middle">Flyway</text>
        <rect x="194" y="-2" width="84"  height="28" rx="14" fill="#12203A" stroke="#1E3A5F"/><text class="mono chip" x="236" y="17" fill="#93C5FD" text-anchor="middle">Hibernate</text>
        <rect x="288" y="-2" width="120" height="28" rx="14" fill="#12203A" stroke="#1E3A5F"/><text class="mono chip" x="348" y="17" fill="#93C5FD" text-anchor="middle">Schema design</text>
        <rect x="418" y="-2" width="106" height="28" rx="14" fill="#12203A" stroke="#1E3A5F"/><text class="mono chip" x="471" y="17" fill="#93C5FD" text-anchor="middle">Indexing</text>
        <rect x="534" y="-2" width="146" height="28" rx="14" fill="#12203A" stroke="#1E3A5F"/><text class="mono chip" x="607" y="17" fill="#93C5FD" text-anchor="middle">Transactions &amp; ACID</text>
      </g>
    </g>

    <!-- ROW 4 · TESTING -->
    <g class="r4" transform="translate(48, 294)">
      <rect x="0" y="-4" width="4" height="40" rx="2" fill="#06B6D4"/>
      <text class="mono" x="20" y="14" font-size="11" fill="#67E8F9" letter-spacing="1.4">TESTING</text>
      <g transform="translate(210, 0)">
        <rect x="0"   y="-2" width="84"  height="28" rx="14" fill="#0B2530" stroke="#155E75"/><text class="mono chip" x="42"  y="17" fill="#67E8F9" text-anchor="middle">JUnit 5</text>
        <rect x="94"  y="-2" width="124" height="28" rx="14" fill="#0B2530" stroke="#155E75"/><text class="mono chip" x="156" y="17" fill="#67E8F9" text-anchor="middle">Testcontainers</text>
        <rect x="228" y="-2" width="84"  height="28" rx="14" fill="#0B2530" stroke="#155E75"/><text class="mono chip" x="270" y="17" fill="#67E8F9" text-anchor="middle">ArchUnit</text>
        <rect x="322" y="-2" width="78"  height="28" rx="14" fill="#0B2530" stroke="#155E75"/><text class="mono chip" x="361" y="17" fill="#67E8F9" text-anchor="middle">Mockito</text>
        <rect x="410" y="-2" width="70"  height="28" rx="14" fill="#0B2530" stroke="#155E75"/><text class="mono chip" x="445" y="17" fill="#67E8F9" text-anchor="middle">JaCoCo</text>
        <rect x="490" y="-2" width="70"  height="28" rx="14" fill="#0B2530" stroke="#155E75"/><text class="mono chip" x="525" y="17" fill="#67E8F9" text-anchor="middle">Vitest</text>
        <rect x="570" y="-2" width="86"  height="28" rx="14" fill="#0B2530" stroke="#155E75"/><text class="mono chip" x="613" y="17" fill="#67E8F9" text-anchor="middle">Playwright</text>
      </g>
    </g>

    <!-- ROW 5 · DELIVERY -->
    <g class="r5" transform="translate(48, 348)">
      <rect x="0" y="-4" width="4" height="40" rx="2" fill="#8B5CF6"/>
      <text class="mono" x="20" y="14" font-size="11" fill="#C4B5FD" letter-spacing="1.4">DELIVERY</text>
      <g transform="translate(210, 0)">
        <rect x="0"   y="-2" width="124" height="28" rx="14" fill="#1B1633" stroke="#4C1D95"/><text class="mono chip" x="62"  y="17" fill="#C4B5FD" text-anchor="middle">GitHub Actions</text>
        <rect x="134" y="-2" width="70"  height="28" rx="14" fill="#1B1633" stroke="#4C1D95"/><text class="mono chip" x="169" y="17" fill="#C4B5FD" text-anchor="middle">Docker</text>
        <rect x="214" y="-2" width="66"  height="28" rx="14" fill="#1B1633" stroke="#4C1D95"/><text class="mono chip" x="247" y="17" fill="#C4B5FD" text-anchor="middle">Maven</text>
        <rect x="290" y="-2" width="66"  height="28" rx="14" fill="#1B1633" stroke="#4C1D95"/><text class="mono chip" x="323" y="17" fill="#C4B5FD" text-anchor="middle">Gradle</text>
        <rect x="366" y="-2" width="72"  height="28" rx="14" fill="#1B1633" stroke="#4C1D95"/><text class="mono chip" x="402" y="17" fill="#C4B5FD" text-anchor="middle">Semgrep</text>
        <rect x="448" y="-2" width="74"  height="28" rx="14" fill="#1B1633" stroke="#4C1D95"/><text class="mono chip" x="485" y="17" fill="#C4B5FD" text-anchor="middle">gitleaks</text>
        <rect x="532" y="-2" width="150" height="28" rx="14" fill="#1B1633" stroke="#4C1D95"/><text class="mono chip" x="607" y="17" fill="#C4B5FD" text-anchor="middle">OWASP dep-check</text>
      </g>
    </g>

    <!-- ROW 6 · FRONTEND -->
    <g class="r6" transform="translate(48, 402)">
      <rect x="0" y="-4" width="4" height="40" rx="2" fill="#F43F5E"/>
      <text class="mono" x="20" y="14" font-size="11" fill="#FDA4AF" letter-spacing="1.4">FRONTEND</text>
      <g transform="translate(210, 0)">
        <rect x="0"   y="-2" width="80"  height="28" rx="14" fill="#2A1015" stroke="#7F1D1D"/><text class="mono chip" x="40"  y="17" fill="#FDA4AF" text-anchor="middle">React 19</text>
        <rect x="90"  y="-2" width="122" height="28" rx="14" fill="#2A1015" stroke="#7F1D1D"/><text class="mono chip" x="151" y="17" fill="#FDA4AF" text-anchor="middle">TanStack Query</text>
        <rect x="222" y="-2" width="98"  height="28" rx="14" fill="#2A1015" stroke="#7F1D1D"/><text class="mono chip" x="271" y="17" fill="#FDA4AF" text-anchor="middle">React Flow</text>
        <rect x="330" y="-2" width="80"  height="28" rx="14" fill="#2A1015" stroke="#7F1D1D"/><text class="mono chip" x="370" y="17" fill="#FDA4AF" text-anchor="middle">Tailwind</text>
        <rect x="420" y="-2" width="60"  height="28" rx="14" fill="#2A1015" stroke="#7F1D1D"/><text class="mono chip" x="450" y="17" fill="#FDA4AF" text-anchor="middle">Vite</text>
      </g>
    </g>

    <rect x="1" y="1" width="1198" height="468" rx="19" fill="none" stroke="#1E293B" stroke-width="2"/>
  </g>
</svg>
